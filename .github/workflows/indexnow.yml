name: IndexNow ping

# Tells Bing, Yandex, Seznam, Naver and other IndexNow engines which pages
# changed, right after GitHub Pages publishes a push to main.
on:
  push:
    branches: [main]
    paths:
      - 'fr/**.html'
      - 'en/**.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for GitHub Pages to publish
        run: sleep 90

      - name: Submit changed URLs
        env:
          HOST: dcmcore.com
          KEY: d409677f2a44fded478d74e00d652181
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess, urllib.request
          host, key = os.environ["HOST"], os.environ["KEY"]
          try:
              files = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"],
                                     capture_output=True, text=True, check=True).stdout.split()
          except subprocess.CalledProcessError:
              files = []
          urls = []
          for f in files:
              if not re.match(r"^(fr|en)/.*\.html$", f) or not os.path.exists(f):
                  continue
              head = open(f, encoding="utf-8", errors="ignore").read(20000)
              if re.search(r'<meta[^>]*name="robots"[^>]*noindex', head, re.I):
                  continue
              u = f"https://{host}/{f}"
              urls.append(u[: -len("index.html")] if u.endswith("/index.html") else u)
          urls = urls[:10000]
          if not urls:
              print("No indexable page changed.")
              raise SystemExit(0)
          body = json.dumps({"host": host, "key": key,
                             "keyLocation": f"https://{host}/{key}.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow:", r.status, "-", len(urls), "URLs")
          EOF
